<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout/base :: layout('error_404', 'eLeave Portal | 404 Error', ~{::content}, ~{::pageStyle})}">

<th:block th:fragment="pageStyle">
    <link rel="stylesheet" th:href="@{/css/pages/home.css}">
    <link rel="stylesheet" th:href="@{/css/pages/error.css}">
</th:block>

<th:block th:fragment="content">
    <section class="error-page section">
        <div class="container grid-2">

            <div class="hero-media">
                <img th:src="@{/images/error/404_Error-pana.svg}" alt="404 Page Not Found">
            </div>

            <div class="error-content">
                <h1>404</h1>
                <h2>Page Not Found</h2>

                <p>
                    The page you are looking for might have been removed,
                    renamed, or is temporarily unavailable.
                </p>

                <div class="error-actions">
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        Go Back
                    </a>

                    <a th:href="@{/}" class="btn btn-primary">
                        Go to Home
                    </a>
                </div>
            </div>
        </div>
    </section>
</th:block>
</html>
