<!DOCTYPE html>
<html lang="en" 
    xmlns:th="http://www.thymeleaf.org" 
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(page, pageTitle, content, pageStyle)">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">

        <title th:text="${pageTitle} ?: 'eLeave Portal'">eLeave Portal</title>

        <link rel="stylesheet" th:href="@{/css/main.css}">

        <th:block th:replace="${pageStyle} ?: ~{}"></th:block>
    </head>

    <body th:attr="data-page=${page}">
        <header th:replace="~{/fragments/navbar :: navbar}"></header>

        <main th:replace="${content}"></main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
        
        <script th:src="@{/js/main.js}" type="module"></script>
    </body>
</html>
