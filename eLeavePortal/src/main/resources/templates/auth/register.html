<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout/base :: layout('register', 'Register | eLeave Portal', ~{::content}, ~{::pageStyle})}">

<th:block th:fragment="pageStyle">
    <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
</th:block>

<th:block th:fragment="content">

    <div class="auth-wrapper">
        <div class="auth-card">

            <h2 class="auth-title">Register</h2>


            <form id="registerForm">

                <div class="form-group">
                    <label class="form-label" for="userName">Username</label>
                    <input class="form-input" type="text" id="userName" name="userName" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="nPassword">Password</label>
                    <input class="form-input" type="password" id="nPassword" name="nPassword" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="cPassword">Confirm Password</label>
                    <input class="form-input" type="password" id="cPassword" name="cPassword" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="userRole">Role</label>
                    <select class="form-select" id="userRole" name="userRole" required>
                        <option value="STUDENT">Student</option>
                        <option value="HOD">HoD</option>
                        <option value="CT">CT</option>
                        <option value="WARDEN">Warden</option>
                    </select>
                </div>
                <p id="registerResponse" class=""></p>
                <button class="btn btn-primary" type="submit">Register</button>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a th:href="@{/login}">Login</a>
            </div>

        </div>
    </div>

</th:block>
</html>
