<!-- HEADER -->
<header th:fragment="navbar" class="site-header"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
    <div class="container header-inner">

        <div class="logo">
            <a href="/">
                <img th:src="@{/images/logo/eLeave.svg}" alt="e-Leave">
            </a>
        </div>

        <nav class="main-nav">

            <span sec:authorize="isAnonymous()">
                <a href="/#vision">Vision</a>
                <a href="/#features">Features</a>
                <a href="/#contact">Contact</a>
                <a href="/login" class="btn btn-primary">Login</a>
            </span>

            <span sec:authorize="isAuthenticated()">

                <span sec:authorize="hasAuthority('STUDENT')">
                    <a href="#">New Application</a>
                    <a href="#">My Applications</a>
                    <a href="#">Faculties</a>
                    <div class="user-menu">
                        <button class="user-toggle" id="userToggle">
                            <a href="#" sec:authentication="name">Username</a>
                            <img th:src="@{/images/icons/profile-circle.svg}" alt="pfp">
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="#">Profile</a>
                            <a id="logoutBtn">Logout</a>
                        </div>
                    </div>
                </span>

                <span sec:authorize="hasAnyAuthority('CT', 'HOD', 'WARDEN', 'HOSTEL_CONTROLLER')">
                    <a href="#">Applications</a>
                    <a href="#">Students</a>
                    <div class="user-menu">
                        <button class="user-toggle" id="userToggle">
                            <a href="#" sec:authentication="name">Username</a>
                            <img th:src="@{/images/icons/profile-circle.svg}" alt="pfp">
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="#">Profile</a>
                            <a id="logoutBtn">Logout</a>
                        </div>
                    </div>
                </span>

                <span sec:authorize="hasAuthority('ADMIN')">
                    <a href="#">Site Status</a>
                    <a href="#">Applications</a>
                    <a href="#">Students</a>
                    <a href="#">Staff</a>
                    <div class="user-menu">
                        <button class="user-toggle" id="userToggle">
                            <a href="#" sec:authentication="name">Username</a>
                            <img th:src="@{/images/icons/profile-circle.svg}" alt="pfp">
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="#">Change Password</a>
                            <a id="logoutBtn">Logout</a>
                            <a href="#">Manage Admins</a>
                            <a href="#">New User</a>
                        </div>
                    </div>
                </span>
                
            </span>
        </nav>
    </div>

    <script th:src="@{/js/pages/navbar.js}" type="module"></script>
    
</header>
